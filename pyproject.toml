[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-health-diabetes"
version = "1.0.0"
description = "Diabetes prediction with a leakage-safe SMOTE + stacking ensemble (XGBoost, ExtraTrees, CatBoost -> Logistic Regression), with SHAP, FastAPI and Streamlit."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
# Exact versions used for the reported results are pinned in requirements.txt.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.8",
    "imbalanced-learn>=0.14",
    "xgboost>=2.1",
    "catboost>=1.2.7",
    "shap>=0.46",
    "matplotlib>=3.8",
    "joblib>=1.4",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "streamlit>=1.50",
    "requests>=2.31",
]

[project.optional-dependencies]
train = ["optuna>=4.0", "mlflow>=3.0"]
dev = ["pytest>=8", "httpx>=0.27", "nbformat>=5.10", "nbconvert>=7.16", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
include = ["src*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
